services:
  - type: web
    name: clip-studio
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Optional: set GEMINI_API_KEY in the Render dashboard for AI clip scoring.
      # Without it the server uses a transparent keyword/hook heuristic instead.
